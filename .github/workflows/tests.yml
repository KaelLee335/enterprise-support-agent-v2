name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/policies/**"
      - "data/seed/**"
      - "data/evaluation/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "AGENTS.md"
      - "task_plan.md"
      - "findings.md"
      - "progress.md"
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".env.example"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/policies/**"
      - "data/seed/**"
      - "data/evaluation/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "AGENTS.md"
      - "task_plan.md"
      - "findings.md"
      - "progress.md"
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".env.example"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.11
      - name: Install locked project and test dependencies
        run: uv sync --locked --extra dev
      - name: Run test suite
        run: uv run --locked pytest -q
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - name: Build Vue demo
        working-directory: frontend
        run: npm ci && npm run build
      - name: Validate Compose configuration without secrets
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build Docker image without pushing
        run: docker compose build
      - name: Smoke-test container without API key
        env:
          PROJECT_DATA_DIR: ${{ runner.temp }}/project-data
        run: |
          mkdir -p "$PROJECT_DATA_DIR/seed"
          cp data/seed/v1_orders.json "$PROJECT_DATA_DIR/seed/"
          docker compose up -d
          cleanup() {
            docker compose down --remove-orphans
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8000"
          headers = {"Authorization": "Bearer demo-a-local-token"}

          with urlopen(f"{base}/health", timeout=3) as response:
              assert json.load(response) == {"status": "ok"}

          order_request = Request(f"{base}/orders/1001", headers=headers)
          with urlopen(order_request, timeout=3) as response:
              order = json.load(response)
          assert order["order_id"] == "1001"
          assert order["tenant_id"] == "demo-a"
          assert order["is_demo"] is True

          platform_order_request = Request(
              f"{base}/ecommerce/orders/2003", headers=headers
          )
          with urlopen(platform_order_request, timeout=5) as response:
              platform_order = json.load(response)
          assert platform_order["order_id"] == "2003"
          assert platform_order["platform"] == "mock-shop"
          assert platform_order["status"] == "delivered"
          assert platform_order["demo_only"] is True

          platform_forbidden_request = Request(
              f"{base}/ecommerce/orders/2004", headers=headers
          )
          try:
              urlopen(platform_forbidden_request, timeout=5)
          except HTTPError as exc:
              assert exc.code == 404
          else:
              raise AssertionError("cross-customer MockShop order should be hidden")

          shop_b_headers = {"Authorization": "Bearer demo-b-local-token"}
          shop_b_order_request = Request(
              f"{base}/ecommerce/orders/2006", headers=shop_b_headers
          )
          with urlopen(shop_b_order_request, timeout=5) as response:
              shop_b_order = json.load(response)
          assert shop_b_order["tenant_id"] == "demo-b"
          try:
              urlopen(Request(f"{base}/ecommerce/orders/2006", headers=headers), timeout=5)
          except HTTPError as exc:
              assert exc.code == 404
          else:
              raise AssertionError("cross-tenant MockShop order should be hidden")

          aftersale_body = json.dumps(
              {
                  "reason": "CI fictional quality issue",
                  "idempotency_key": "ci-demo-aftersale-2003",
                  "confirmed": True,
              }
          ).encode()
          aftersale_request = Request(
              f"{base}/ecommerce/orders/2003/aftersales",
              data=aftersale_body,
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(aftersale_request, timeout=5) as response:
              aftersale = json.load(response)
          assert aftersale["status"] == "pending_demo"
          assert aftersale["demo_only"] is True

          logistics_request = Request(
              f"{base}/chat",
              data=json.dumps({"question": "查询订单1001物流到哪了"}).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(logistics_request, timeout=5) as response:
              logistics = json.load(response)
          assert logistics["intent"] == "logistics_lookup"
          assert logistics["shipment"]["tracking_number"] == "DEMO-SHIP-1001"
          assert logistics["shipment"]["demo_only"] is True

          chat_request = Request(
              f"{base}/chat",
              data=json.dumps({"question": "退货规则是什么？"}).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(chat_request, timeout=10) as response:
              result = json.load(response)
          assert result["error"] == "RuntimeError"
          assert result["evidence"] == []
          assert "无法确认" in result["answer"]
          PY
