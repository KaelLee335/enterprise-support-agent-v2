name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/policies/**"
      - "data/seed/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".env.example"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/policies/**"
      - "data/seed/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".env.example"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.11
      - name: Install locked project and test dependencies
        run: uv sync --locked --extra dev
      - name: Run test suite
        run: uv run --locked pytest -q
      - name: Build Vue demo
        working-directory: frontend
        run: npm ci && npm run build
      - name: Validate Compose configuration without secrets
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build Docker image without pushing
        run: docker compose build
      - name: Smoke-test container without API key
        env:
          PROJECT_DATA_DIR: ${{ runner.temp }}/project-data
        run: |
          mkdir -p "$PROJECT_DATA_DIR/seed"
          cp data/seed/v1_orders.json "$PROJECT_DATA_DIR/seed/"
          docker compose up -d
          cleanup() {
            docker compose down --remove-orphans
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8000"
          headers = {"Authorization": "Bearer demo-a-local-token"}

          with urlopen(f"{base}/health", timeout=3) as response:
              assert json.load(response) == {"status": "ok"}

          order_request = Request(f"{base}/orders/1001", headers=headers)
          with urlopen(order_request, timeout=3) as response:
              order = json.load(response)
          assert order["order_id"] == "1001"
          assert order["tenant_id"] == "demo-a"
          assert order["is_demo"] is True

          logistics_request = Request(
              f"{base}/chat",
              data=json.dumps({"question": "查询订单1001物流到哪了"}).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(logistics_request, timeout=5) as response:
              logistics = json.load(response)
          assert logistics["intent"] == "logistics_lookup"
          assert logistics["shipment"]["tracking_number"] == "DEMO-SHIP-1001"
          assert logistics["shipment"]["demo_only"] is True

          chat_request = Request(
              f"{base}/chat",
              data=json.dumps({"question": "退货规则是什么？"}).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(chat_request, timeout=10) as response:
              result = json.load(response)
          assert result["error"] == "RuntimeError"
          assert result["evidence"] == []
          assert "无法确认" in result["answer"]
          PY
